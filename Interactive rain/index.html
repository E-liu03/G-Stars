<!DOCTYPE html>
<html>
<head>
  <title>渋谷 Shibuya Diorama</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
    }
    h1 {
      margin-bottom: 15px;
      font-weight: 300;
      letter-spacing: 2px;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .control-group {
      background: rgba(255,255,255,0.1);
      padding: 10px 15px;
      border-radius: 6px;
    }
    .control-group h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }
    .key {
      display: inline-block;
      background: #333;
      padding: 4px 10px;
      border-radius: 4px;
      margin: 2px;
      font-size: 13px;
      border: 1px solid #555;
    }
    .key.green { background: #2d5a27; border-color: #4a9; }
    .key.yellow { background: #8a7a20; border-color: #cc0; }
    .key.red { background: #6a2020; border-color: #c44; }
    .key.auto { background: #2a4a6a; border-color: #48c; }
    .key.rain { background: #2a4a5a; border-color: #6af; }
  </style>
</head>
<body>
  <h1>渋谷 SHIBUYA DIORAMA</h1>
  <canvas id="gfx-main" width="900" height="600"></canvas>
  <div class="controls">
    <div class="control-group">
      <h3>Camera Rotate</h3>
      <span class="key">A</span>
      <span class="key">D</span>
    </div>
    <div class="control-group">
      <h3>Zoom</h3>
      <span class="key">W</span>
      <span class="key">S</span>
    </div>
    <div class="control-group">
      <h3>Height</h3>
      <span class="key">Q</span>
      <span class="key">E</span>
    </div>
    <div class="control-group">
      <h3>Auto-rotate</h3>
      <span class="key">Space</span>
    </div>
    <div class="control-group">
      <h3>🚦 Traffic Lights</h3>
      <span class="key green">G</span>
      <span class="key yellow">Y</span>
      <span class="key red">R</span>
      <span class="key auto">T</span>
    </div>
    <div class="control-group">
      <h3>🌧️ Weather</h3>
      <span class="key rain">P</span>
    </div>
    <div class="control-group">
      <h3>🎌 Flag Wave</h3>
      <span class="key rain">F</span>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
